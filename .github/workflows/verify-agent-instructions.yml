name: Verify website

on:
  pull_request:
    paths:
      - "content/agent-instructions/**"
      - "content/agent-skills/**"
      - "docs/ai-installation-acceptance.md"
      - "public/**"
      - "firebase.json"
      - "firestore.rules"
      - "scripts/build-agent-instructions.mjs"
      - "scripts/install-skill.template.sh"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - "worker/**"
      - "wrangler.jsonc"
      - "DEPLOY.md"
      - "README.md"
      - ".github/workflows/firebase-deploy.yml"
      - ".github/workflows/verify-agent-instructions.yml"
  push:
    branches: [main]
    paths:
      - "content/agent-instructions/**"
      - "content/agent-skills/**"
      - "docs/ai-installation-acceptance.md"
      - "public/**"
      - "firebase.json"
      - "firestore.rules"
      - "scripts/build-agent-instructions.mjs"
      - "scripts/install-skill.template.sh"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - "worker/**"
      - "wrangler.jsonc"
      - "DEPLOY.md"
      - "README.md"
      - ".github/workflows/firebase-deploy.yml"
      - ".github/workflows/verify-agent-instructions.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code
      - run: npm test
      - run: npm run worker:dry-run
